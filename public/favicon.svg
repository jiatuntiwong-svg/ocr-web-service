<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="docroom-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="docroom-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#818CF8" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#818CF8"/>
      <stop offset="70%"  stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="docroom-d">
      <path d="M36 28 L36 172 L84 172 C152 172 176 140 176 100 C176 60 152 28 84 28 Z"/>
    </clipPath>
  </defs>
  <!-- Scan beam clipped to the D silhouette. SMIL keeps it animated when the
       SVG is rendered as <img>, in favicons, and as inline markup. -->
  <g clip-path="url(#docroom-d)">
    <g>
      <rect x="0" y="92" width="200" height="16" fill="url(#docroom-beam)" opacity="0.2"/>
      <rect x="0" y="97" width="200" height="6"  fill="url(#docroom-beam)" opacity="0.9"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,-34; 0,34; 0,-34"
        keyTimes="0; 0.5; 1"
        dur="3s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate
        attributeName="opacity"
        values="0; 1; 1; 0; 0; 1; 1; 0"
        keyTimes="0; 0.04; 0.46; 0.5; 0.5; 0.54; 0.96; 1"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
  </g>
  <!-- D silhouette: corner brackets + arcs -->
  <path d="M36 74 L36 28 L88 28"    fill="none" stroke="url(#docroom-stroke)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 126 L36 172 L88 172" fill="none" stroke="url(#docroom-stroke)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M124 28 C164 28 176 60 176 100"   fill="none" stroke="url(#docroom-stroke)" stroke-width="11" stroke-linecap="round"/>
  <path d="M176 100 C176 140 164 172 124 172" fill="none" stroke="url(#docroom-stroke)" stroke-width="11" stroke-linecap="round"/>
</svg>
